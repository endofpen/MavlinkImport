# Beispiel-Stack zum lokalen Testen: Telemetrie-Sender + Mock-Endpoint.
# In Produktion zeigt --http-host auf den echten REST-Server (Service "echo"
# dann entfernen) und --http-port/--route entsprechend anpassen.
#
# Start:   docker compose up --build
# Stop:    docker compose down

services:
  telemetry:
    build: .
    # CLI-Parameter bleiben erhalten und werden hier gesetzt:
    command:
      - --mode
      - server
      - --connection
      - udpin://0.0.0.0:14550
      - --http-host
      - echo            # Service-Name des Mock-Endpoints im Compose-Netz
      - --http-port
      - "8000"
      - --route
      - /telemetry
      - --drone-name
      - Drohne-1
      - --drone-id
      - "1"
    ports:
      - "14550:14550/udp"   # MAVLink von der Drohne (UDP)
    depends_on:
      - echo
    restart: unless-stopped

  echo:
    build: .
    # Ueberschreibt den ENTRYPOINT, um stattdessen den Mock-Endpoint zu starten.
    entrypoint: ["python", "-u", "echo_server.py"]
    command: ["--host", "0.0.0.0", "--port", "8000", "--route", "/telemetry"]
    ports:
      - "8000:8000"         # Endpoint auch vom Host aus erreichbar
    restart: unless-stopped
